name: deploy
# Builds specimen content from Zenodo, builds the web app, and publishes both to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Lists every specimen archive in the two Zenodo records, so new specimens need no edit here.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      specimens: ${{ steps.list.outputs.specimens }}
    steps:
      - id: list
        shell: python
        run: |
          import json, os, time, urllib.request
          def keys(record):
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(f"https://zenodo.org/api/records/{record}", timeout=60) as r:
                          return [f["key"] for f in json.load(r)["files"]]
                  except Exception as e:
                      print("retrying:", e)
                      time.sleep(15 * (attempt + 1))
              raise SystemExit(f"could not list record {record}")
          items = [{"kind": "openear", "id": k[:-4].upper(), "pkg": "OPENEAR-" + k[:-4].upper()}
                   for k in keys(1473724) if k.lower().endswith(".zip")]
          items += [{"kind": "bern", "id": k[:-4], "pkg": "BERN-" + k[:-4]}
                    for k in keys(3355272) if k.lower().endswith(".zip")]
          print(json.dumps(items, indent=1))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("specimens=" + json.dumps(items) + "\n")

  content:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One failed specimen must not hold back the others; the site job publishes what was built.
      fail-fast: false
      max-parallel: 8
      matrix:
        specimen: ${{ fromJSON(needs.plan.outputs.specimens) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # A package is rebuilt only when the pipeline or the ontology changes.
      - id: cache
        uses: actions/cache@v4
        with:
          path: content-out
          key: content-v2-${{ matrix.specimen.pkg }}-${{ hashFiles('DATA_PIPELINE/**', 'ontology/**') }}
      # `shell: bash` turns on pipefail, so a failed build cannot hide behind `tee`.
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: DATA_PIPELINE
        shell: bash
        run: |
          pip install -e .
          python -u build_content.py ${{ matrix.specimen.kind }} ${{ matrix.specimen.id }} ../content-out/${{ matrix.specimen.pkg }} | tee -a "$GITHUB_STEP_SUMMARY"
      - run: du -sh content-out/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: content-${{ matrix.specimen.pkg }}
          path: content-out
          if-no-files-found: error

  site:
    needs: content
    # Publish whatever was built, even when a specimen failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: |
          npm ci
          npm run build:pwa
      - uses: actions/download-artifact@v4
        with:
          pattern: content-*
          path: app/dist/content
          merge-multiple: true
      - name: Write the specimen index
        shell: python
        run: |
          import json, pathlib
          root = pathlib.Path("app/dist/content")
          specimens = []
          # The specimen the reviewer has worked on opens first, then OpenEar, then Bern.
          order = lambda m: (m.parent.name != "OPENEAR-ZETA", not m.parent.name.startswith("OPENEAR"), m.parent.name)
          for m in sorted(root.glob("*/manifest.json"), key=order):
              specimens.append({"id": json.loads(m.read_text(encoding="utf-8"))["specimen_id"], "path": m.parent.name})
          if not specimens:
              raise SystemExit("no specimen was built")
          (root / "index.json").write_text(json.dumps({"specimens": specimens}, indent=2), encoding="utf-8")
          print(len(specimens), "specimens:", ", ".join(s["id"] for s in specimens))
      - run: du -sh app/dist/content | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
