name: deploy
# Builds specimen content from Zenodo, builds the web app, and publishes both to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Lists every specimen archive in the two Zenodo records, so new specimens need no edit here.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      specimens: ${{ steps.list.outputs.specimens }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        shell: python
        run: |
          import json, os
          # The chosen specimens (.github/specimens.json) are built; the list does not depend
          # on Zenodo answering, which it sometimes refuses to GitHub's runners (HTTP 403).
          items = []
          for e in json.load(open(".github/specimens.json"))["specimens"]:
              kind, _, ident = e["pkg"].partition("-")
              items.append({"kind": kind.lower(), "id": ident, "pkg": e["pkg"]})
          print(json.dumps(items, indent=1))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("specimens=" + json.dumps(items) + "\n")

  content:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      # One failed specimen must not hold back the others; the site job publishes what was built.
      fail-fast: false
      max-parallel: 4
      matrix:
        specimen: ${{ fromJSON(needs.plan.outputs.specimens) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # A package is rebuilt only when the pipeline or the ontology changes.
      - id: cache
        uses: actions/cache@v4
        with:
          path: content-out
          key: content-v2-${{ matrix.specimen.pkg }}-${{ hashFiles('DATA_PIPELINE/**', 'ontology/**') }}
      # `shell: bash` turns on pipefail, so a failed build cannot hide behind `tee`.
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: DATA_PIPELINE
        shell: bash
        run: |
          pip install -e .
          python -u build_content.py ${{ matrix.specimen.kind }} ${{ matrix.specimen.id }} ../content-out/${{ matrix.specimen.pkg }} | tee -a "$GITHUB_STEP_SUMMARY"
      - run: du -sh content-out/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: content-${{ matrix.specimen.pkg }}
          path: content-out
          if-no-files-found: error

  site:
    needs: content
    # Publish whatever was built, even when a specimen failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional: with this secret set, scans are published to a Hugging Face dataset
      # instead of GitHub Pages, which keeps the site under its 1 GB limit.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: |
          npm ci
          npm run build:pwa
      - uses: actions/download-artifact@v4
        with:
          pattern: content-*
          path: app/dist/content
          merge-multiple: true
      # deploy-pages looks for its artifact in the first page of 30 artifacts only; with one
      # artifact per specimen (31 at the time) it missed it. Merging keeps the run to two artifacts.
      - uses: actions/upload-artifact/merge@v4
        with:
          name: content-all
          pattern: content-*
          delete-merged: true
      - name: Write the specimen index
        shell: python
        run: |
          import json, pathlib
          root = pathlib.Path("app/dist/content")
          specimens = []
          # In the order of .github/specimens.json: the reviewer's specimen first.
          chosen = [e["pkg"] for e in json.load(open(".github/specimens.json"))["specimens"]]
          order = lambda m: chosen.index(m.parent.name) if m.parent.name in chosen else len(chosen)
          for m in sorted(root.glob("*/manifest.json"), key=order):
              manifest = json.loads(m.read_text(encoding="utf-8"))
              specimens.append({"id": manifest["specimen_id"], "path": m.parent.name,
                                "dataset": manifest["dataset"], "side": manifest.get("side")})
          if not specimens:
              raise SystemExit("no specimen was built")
          (root / "index.json").write_text(json.dumps({"specimens": specimens}, indent=2), encoding="utf-8")
          print(len(specimens), "specimens:", ", ".join(s["id"] for s in specimens))
      - name: Publish scans to Hugging Face
        if: env.HF_TOKEN != ''
        run: |
          python3 -m pip install --quiet --user "huggingface_hub>=0.25"
          python3 .github/scripts/publish_scans_hf.py app/dist/content | tee -a "$GITHUB_STEP_SUMMARY"
      - run: du -sh app/dist/content | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      # deploy-pages sometimes looks for the artifact before the API lists it ("No artifacts
      # named github-pages"); wait and try once more before failing the run.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
