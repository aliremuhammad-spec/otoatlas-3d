name: air-probe
# One-off diagnostic for the middle ear air space; run by hand.
on:
  workflow_dispatch:
    inputs:
      specimen:
        default: ZETA
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -e DATA_PIPELINE
          python -u .github/scripts/air_probe.py ${{ inputs.specimen }} | tee -a "$GITHUB_STEP_SUMMARY"
